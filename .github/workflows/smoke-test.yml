name: smoke-test
# Phase 1 spike: checks secrets, then times two free TTS models on a CPU runner.
on:
  workflow_dispatch:
  push:
    branches: ["phase1/**"]
concurrency: { group: smoke-test, cancel-in-progress: true }

jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "| Secret | Result | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          bash tools/smoke/check_keys.sh

  kokoro:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: tools/smoke/requirements-kokoro.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install -q -r tools/smoke/requirements-kokoro.txt
      - name: Generate samples
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python tools/smoke/tts_kokoro.py
      - uses: actions/upload-artifact@v4
        with: { name: kokoro-v2-samples, path: renders/smoke/, retention-days: 14 }

  gemini-tts:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate samples
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python3 tools/smoke/tts_gemini.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gemini-samples, path: renders/smoke/, retention-days: 14 }
