name: render-short
# Renders one Short end to end and pushes the MP4 plus a contact sheet to the
# `renders` branch, so renders can be reviewed without downloading artifacts.
on:
  workflow_dispatch:
    inputs:
      video: {description: "Video folder", default: "content/a-maps-data/2026-11-20-greenland-vs-africa-14x"}
  push:
    branches: ["phase1/**"]
    paths: ["render/**", "tools/render/**", ".github/workflows/render-short.yml"]
concurrency: { group: render-short, cancel-in-progress: true }
permissions: { contents: write }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VIDEO: ${{ github.event.inputs.video || 'content/a-maps-data/2026-11-20-greenland-vs-africa-14x' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: tools/smoke/requirements-kokoro.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install -q -r tools/smoke/requirements-kokoro.txt
      - name: Voice and timings
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python tools/render/prepare_short.py "$VIDEO"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install render deps
        working-directory: render
        run: npm install --no-audit --no-fund
      - name: Render
        working-directory: render
        run: |
          ID=$(basename "$VIDEO")
          npx remotion render src/index.ts Short "out/$ID.mp4" --props="public/$ID/props.json" --log=info
          echo "ID=$ID" >> $GITHUB_ENV
      - name: Contact sheet
        run: |
          cd render/out
          ffmpeg -v error -y -i "$ID.mp4" -vf "fps=1/2,scale=270:-1,tile=6x3:padding=6:color=white" -frames:v 1 "$ID-contact.png"
          ffmpeg -v error -y -i "$ID.mp4" -frames:v 1 "$ID-frame0.png"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$ID.mp4")
          echo "Rendered **$ID**: $D s" >> $GITHUB_STEP_SUMMARY
      - name: Push to renders branch
        run: |
          mkdir /tmp/r && cp render/out/* /tmp/r/ && cp "render/public/$ID/props.json" "/tmp/r/$ID-props.json" && cd /tmp/r
          git init -q -b renders && git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git add . && git commit -qm "Render $ID from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" renders
      - uses: actions/upload-artifact@v4
        with: { name: render, path: render/out/, retention-days: 14 }
