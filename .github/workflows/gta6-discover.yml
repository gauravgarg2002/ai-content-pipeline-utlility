name: gta6-discover
# One-off: find official Rockstar GTA VI media URLs (videos, zips) for footage.
on:
  push:
    branches: ["gta6/discover"]
permissions: { contents: write }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install -q "yt-dlp[default]"
      - run: |
          mkdir -p /tmp/o && cd /tmp/o
          df -h / > disk.txt
          B=https://media-rockstargames-com.akamaized.net/VI/downloads
          for f in videos/GTAVI_An_Extended_Look/GTAVI_An_Extended_Look.mp4 videos/GTAVI_Launch_Trailer/GTAVI_Launch_Trailer.mp4 videos/GTAVI_Trailer_2/GTAVI_Trailer_2.mp4 videos/GTAVI_Trailer_1/GTAVI_Trailer_1.mp4 videos/GTAVI_Out_Now/GTAVI_Out_Now.mp4 screenshots/GTAVI_Screenshots.zip; do
            echo "$f $(curl -sIL $B/$f | grep -i content-length | tail -1)" >> sizes2.txt
          done
          curl -sL -r 0-2000000 $B/videos/GTAVI_Trailer_1/GTAVI_Trailer_1.mp4 -o head.mp4; ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate -of compact head.mp4 > probe.txt 2>&1 || true
          git init -q -b gta6-discover && git config user.name bot && git config user.email bot@users.noreply.github.com
          rm -f head.mp4; git add . && git commit -qm discover2
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gta6-discover
