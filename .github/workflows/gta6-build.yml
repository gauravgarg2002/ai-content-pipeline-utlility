name: gta6-build
# Builds GTA 6 videos end to end (voice, footage, matching, render, thumbnail), one job per video,
# and pushes each result to its own branch `gta6-render/<video>` for review.
# Videos come from gta6/build-queue.txt (one folder name per line) or the `videos` input.
# The MP4 is split into <95 MB parts (GitHub's file limit); rejoin with `cat final.mp4.part* > final.mp4`.
on:
  workflow_dispatch:
    inputs:
      videos: {description: "Comma-separated video folders under gta6/content/<channel> (empty = build-queue.txt)", default: ""}
      channel: {description: "hi or en", default: "en"}
  push:
    branches: ["gta6/**"]
    paths: ["gta6/build-queue.txt", "gta6/pipeline/**", "gta6/config.json", ".github/workflows/gta6-build.yml"]
concurrency:
  group: gta6-build-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: write }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      videos: ${{ steps.q.outputs.videos }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          IN="${{ github.event.inputs.videos }}"
          if [ -n "$IN" ]; then LIST=$(echo "$IN" | tr ',' '\n'); else LIST=$(grep -v '^\s*$' gta6/build-queue.txt); fi
          echo "videos=$(echo "$LIST" | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> $GITHUB_OUTPUT

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3          # Gemini free tier: 5 requests/min on Flash
      matrix:
        video: ${{ fromJson(needs.plan.outputs.videos) }}
    env:
      VIDEO: ${{ matrix.video }}
      CH: ${{ github.event.inputs.channel || 'en' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: gta6/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r gta6/requirements.txt "yt-dlp[default]"
      - name: Font (Inter Bold, free)
        run: |
          mkdir -p gta6/assets/fonts
          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip \
            && unzip -o -j -q /tmp/inter.zip "extras/ttf/Inter-Bold.ttf" -d gta6/assets/fonts || echo "Inter download failed; DejaVu fallback"
      - name: Restore footage cache (converted sources, scene tags)
        uses: actions/cache/restore@v4
        with:
          path: |
            gta6/cache/sources
            gta6/cache/scenes
            gta6/cache/frames
          key: gta6-official-v1
          restore-keys: gta6-official-v1-
      - name: Voice
        working-directory: gta6
        run: set -o pipefail; python -m pipeline -c "$CH" voice "$VIDEO" 2>&1 | tee -a build.log
      - name: Footage (official Rockstar media, 720p)
        working-directory: gta6
        run: set -o pipefail; python -m pipeline -c "$CH" source "$VIDEO" 2>&1 | tee -a build.log; df -h / | tee -a build.log
      - name: Index scenes (Gemini vision)
        working-directory: gta6
        run: set -o pipefail; python -m pipeline -c "$CH" index "$VIDEO" 2>&1 | tee -a build.log
      - name: Match footage to script
        working-directory: gta6
        run: set -o pipefail; python -m pipeline -c "$CH" match "$VIDEO" 2>&1 | tee -a build.log
      - name: Render
        working-directory: gta6
        run: set -o pipefail; python -m pipeline -c "$CH" assemble "$VIDEO" 2>&1 | tee -a build.log
      - name: Thumbnail and metadata
        working-directory: gta6
        run: set -o pipefail; python -m pipeline -c "$CH" thumbnail "$VIDEO" 2>&1 | tee -a build.log
      - name: Collect output
        if: always()
        run: |
          D="gta6/content/$CH/$VIDEO"; O=/tmp/out; mkdir -p $O
          cp gta6/build.log $O/ || true
          for f in script.md script.json sources.json edl.json timing.json captions.srt metadata.json thumbnail.jpg status.json; do cp "$D/$f" $O/ 2>/dev/null || true; done
          if [ -f "$D/final.mp4" ]; then
            ffprobe -v error -show_entries format=duration,size -of compact "$D/final.mp4" | tee $O/final-info.txt
            split -b 95m -d "$D/final.mp4" $O/final.mp4.part
            echo "$VIDEO rendered: $(cat $O/final-info.txt)" >> $GITHUB_STEP_SUMMARY
          else
            echo "$VIDEO: no final.mp4; see build.log" >> $GITHUB_STEP_SUMMARY
          fi
          cd $O && git init -q -b out && git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git add . && git commit -qm "GTA6 build $VIDEO from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "out:gta6-render2/$VIDEO"
