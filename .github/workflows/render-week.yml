name: render-week
# Voices and renders every video of one week (content/*/<WEEK>-*), then
# publishes MP4s, contact sheets and logs to the `renders-<WEEK>` branch
# (`renders-<WEEK>-extra` when only a subset is remade).
on:
  workflow_dispatch:
    inputs:
      week: { description: "Content date prefix, e.g. 2026-11-30; empty = DEFAULT_WEEK", default: "" }
      only: { description: "Space-separated content paths to (re)make; empty = all of the week", default: "" }
  push:
    branches: ["phase1/**"]
    paths: ["render/**", "tools/render/**", "config/voices.json", "content/**/scenes.json", ".github/workflows/render-week.yml"]
concurrency: { group: "render-week-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: write }

env:
  WEEK: "${{ inputs.week || '2026-11-30' }}"
  ONLY: "${{ inputs.only }}"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      kokoro: ${{ steps.p.outputs.kokoro }}
      gemini: ${{ steps.p.outputs.gemini }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os
          week, only = os.environ["WEEK"], os.environ.get("ONLY", "").split()
          dirs = sorted(d.rstrip("/") for d in glob.glob(f"content/*/{week}-*/"))
          if only: dirs = [d for d in dirs if d in only]
          gem = {"b-ai-hinglish", "c-pilot-horror-hi"}
          k = [d for d in dirs if d.split("/")[1] not in gem]; g = [d for d in dirs if d.split("/")[1] in gem]
          print("matrix=" + json.dumps({"video": [d[len("content/"):] for d in dirs] or ["none"]}))
          print("kokoro=" + " ".join(k)); print("gemini=" + " ".join(g))
          PY
          cat "$GITHUB_OUTPUT"

  voice-kokoro:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: tools/smoke/requirements-kokoro.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: pip install -q -r tools/smoke/requirements-kokoro.txt
      - name: Voice
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          mkdir -p logs; set -o pipefail
          for v in ${{ needs.plan.outputs.kokoro }}; do python tools/render/prepare.py "$v" 2>&1 | tee -a logs/voice-kokoro.log; done
      - uses: actions/upload-artifact@v4
        with: { name: inputs-kokoro, path: render/public/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: log-voice-kokoro, path: logs/, retention-days: 7, if-no-files-found: ignore }

  voice-gemini:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy soundfile
      - name: Restore voice cache
        uses: actions/cache/restore@v4
        with: { path: .voice-cache, key: "voice-gemini-${{ github.run_id }}", restore-keys: "voice-gemini-" }
      - name: Voice (one request at a time, free-tier safe)
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          mkdir -p logs; set -o pipefail
          for v in ${{ needs.plan.outputs.gemini }}; do
            python tools/render/prepare.py "$v" 2>&1 | tee -a logs/voice-gemini.log; rc=${PIPESTATUS[0]}
            if [ $rc -eq 76 ]; then echo "daily Gemini limit reached; stopping before $v" | tee -a logs/voice-gemini.log; break; fi
            [ $rc -ne 0 ] && echo "voice failed for $v ($rc)" | tee -a logs/voice-gemini.log
          done; true
      - name: Save voice cache
        if: always()
        uses: actions/cache/save@v4
        with: { path: .voice-cache, key: "voice-gemini-${{ github.run_id }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: inputs-gemini, path: render/public/, retention-days: 7, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: log-voice-gemini, path: logs/, retention-days: 7, if-no-files-found: ignore }

  render:
    needs: [plan, voice-kokoro, voice-gemini]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "inputs-*", path: render/public, merge-multiple: true }
      - name: Check inputs
        run: |
          ID=$(basename "${{ matrix.video }}"); echo "ID=$ID" >> $GITHUB_ENV
          if [ -f "render/public/$ID/props.json" ]; then echo "ok=1" >> $GITHUB_ENV; else echo "::warning::no voiced input for $ID, skipping"; echo "ok=0" >> $GITHUB_ENV; fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        if: env.ok == '1'
      - uses: actions/setup-node@v4
        if: env.ok == '1'
        with: { node-version: "22" }
      - uses: actions/cache@v4
        if: env.ok == '1'
        with: { path: ~/.npm, key: "npm-${{ hashFiles('render/package.json') }}" }
      - name: Install
        if: env.ok == '1'
        working-directory: render
        run: npm install --no-audit --no-fund
      - name: Render
        if: env.ok == '1'
        working-directory: render
        run: |
          mkdir -p out; set -o pipefail
          npx remotion render src/index.ts Short "out/$ID.mp4" --props="public/$ID/props.json" --crf=22 --timeout=120000 2>&1 | tail -c 20000 | tee "out/$ID-render.log"
      - name: Contact sheet
        if: env.ok == '1' && hashFiles(format('render/out/{0}.mp4', env.ID)) != ''
        run: |
          cd render/out
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$ID.mp4")
          STEP=$(python3 -c "print(max(1.0, $D/24))")
          ffmpeg -v error -y -i "$ID.mp4" -vf "fps=1/$STEP,scale=320:-1,tile=8x3:padding=6:color=white" -frames:v 1 "$ID-contact.jpg"
          ffmpeg -v error -y -i "$ID.mp4" -frames:v 1 -q:v 3 "$ID-frame0.jpg"
          echo "**$ID**: ${D}s" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always() && env.ok == '1'
        with: { name: "video-${{ env.ID }}", path: render/out/, retention-days: 14, if-no-files-found: ignore }

  publish:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "video-*", path: /tmp/week1, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "log-*", path: /tmp/week1/logs, merge-multiple: true }
      - name: Push to renders branch
        run: |
          cd /tmp/week1 && ls -la
          mkdir -p /tmp/r && cp -r /tmp/week1 /tmp/r/week && cd /tmp/r
          B=renders-$WEEK${{ inputs.only && '-extra' || '' }}; [ "$WEEK" = 2026-11-20 ] && B=${B/renders-2026-11-20/renders-week1}
          git init -q -b $B && git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git add . && git commit -qm "Week 1 renders from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" $B
